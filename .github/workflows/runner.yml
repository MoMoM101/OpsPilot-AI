name: Runner

on:
  pull_request:
    paths:
      - 'runner/**'
      - 'docker-compose.yml'
      - '.github/workflows/runner.yml'
  push:
    branches: [main]
    paths:
      - 'runner/**'
      - 'docker-compose.yml'
      - '.github/workflows/runner.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e './runner[dev]'
      - run: python -m pytest
        working-directory: runner
      - name: SSRF and command boundary regression gate
        run: >-
          python -m pytest tests/test_probe_connectors.py
          tests/test_docker_connector.py tests/test_docker_actions.py
        working-directory: runner
      - run: python -m ruff check .
        working-directory: runner
      - run: python -m mypy opspilot_runner
        working-directory: runner
      - run: docker build --tag opspilot-runner-ci ./runner
