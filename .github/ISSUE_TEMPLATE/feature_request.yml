name: Feature request
description: Propose an improvement to OpsPilot AI
title: "[Feature]: "
labels: ["enhancement", "needs-triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What operator or contributor problem should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed outcome
      description: Describe the desired behavior rather than only an implementation.
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: Safety and authorization impact
      description: Note any effect on Environment Scope, Policy, Approval, Runner, secrets, or audit.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered

