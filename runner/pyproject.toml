[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "opspilot-runner"
version = "0.1.0"
description = "OpsPilot isolated read-only execution plane"
requires-python = ">=3.12,<3.14"
dependencies = [
  "httpx>=0.28,<1",
  "pydantic-settings>=2.7,<3",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.15,<2",
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.25,<2",
  "ruff>=0.11,<1",
]

[project.scripts]
opspilot-runner = "opspilot_runner.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["opspilot_runner"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
